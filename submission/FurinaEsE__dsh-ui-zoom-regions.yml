url: https://github.com/FurinaEsE/dsh-ui-zoom-regions
name: FurinaEsE/dsh-ui-zoom-regions
category: ui
description:
  en: Per-region UI zoom for DeepSeek Harness — Ctrl + wheel sets independent zoom levels for the conversation header, the left sidebar, the conversation body and the right sidebar, and a grip on the header scales it down without hiding its labels.
  zh: DeepSeek Harness 分区域缩放：Ctrl + 滚轮分别为会话顶栏、左侧栏、会话正文和右侧面板设置独立比例，顶栏底边的把手还能把它等比例缩小而文字全部保留。
